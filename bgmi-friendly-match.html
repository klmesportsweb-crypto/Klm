<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KLM Esports BGMI Friendly Match</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
:root{--bg:#0c0906;--gold:#e0a030;--gold2:#ffd27a;--ink:#f6efe4;--green:#6cc04a;--muted:#b9a98f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Barlow Condensed','Arial Narrow',sans-serif;min-height:100%}
body{display:flex;justify-content:center;overflow-x:hidden}
.poster{position:relative;width:100%;max-width:480px;min-height:100vh;padding:28px 22px 36px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#3a2410 0%,#150e08 45%,#0c0906 75%)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.poster>*:not(canvas){position:relative;z-index:1}
.game{font-weight:700;font-size:20px;letter-spacing:.35em;color:var(--gold2);border:2px solid var(--gold);padding:4px 16px 4px 22px;animation:glow 2.4s ease-in-out infinite}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(46px,15vw,70px);line-height:.95;margin-top:14px;text-transform:uppercase;letter-spacing:.02em;background:linear-gradient(100deg,#fff 0%,#fff 38%,var(--gold2) 50%,#fff 62%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 4s linear infinite}
.logo{width:min(78%,340px);aspect-ratio:1;margin:6px 0 0;-webkit-mask-image:radial-gradient(circle,#000 55%,transparent 72%);mask-image:radial-gradient(circle,#000 55%,transparent 72%);animation:float 5s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(224,160,48,.35))}
.free{margin-top:-6px;font-family:Anton,Impact,sans-serif;font-size:30px;letter-spacing:.08em;color:#10240a;background:var(--green);padding:6px 26px;transform:skewX(-10deg);animation:pulse 1.6s ease-in-out infinite}
.free span{display:inline-block;transform:skewX(10deg)}
.when{display:flex;gap:12px;margin-top:22px;width:100%}
.when div{flex:1;border:1.5px solid var(--gold);padding:10px 6px;background:rgba(224,160,48,.08)}
.when b{display:block;font-size:30px;font-weight:700;color:var(--gold2);line-height:1.05}
.when small{font-size:16px;color:var(--muted);letter-spacing:.08em}
.count{display:flex;gap:10px;margin-top:20px}
.count div{min-width:62px}
.count b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px;color:var(--ink)}
.count small{font-size:14px;color:var(--muted);letter-spacing:.1em}
.dm{margin-top:24px;display:block;width:100%;text-decoration:none;color:#1a1004;background:linear-gradient(90deg,var(--gold),var(--gold2));padding:14px 10px;font-weight:700;font-size:22px;letter-spacing:.04em}
.dm small{display:block;font-size:15px;font-weight:500}
.dm:focus-visible{outline:3px solid #fff;outline-offset:3px}
.org{margin-top:16px;font-size:15px;letter-spacing:.2em;color:var(--muted)}
@keyframes float{50%{transform:translateY(-10px) scale(1.02)}}
@keyframes sheen{to{background-position:-250% 0}}
@keyframes glow{50%{box-shadow:0 0 18px rgba(224,160,48,.6)}}
@keyframes pulse{50%{transform:skewX(-10deg) scale(1.06);box-shadow:0 0 26px rgba(108,192,74,.6)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
